# Gera a ISO de TESTE do Big WindowMaker (edição bigcommunity/wmaker).
#
#   lint (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    sem privilégios: valida as entradas, confere links simbólicos
# (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).           da edição, roda os testes pytest do iso-profiles, bash -n e
# (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).           shellcheck nos scripts deste repositório (e o self-test do
# (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).           org-readme.py).
#   local-repo  baixa os pacotes dos artefatos de CI de big-windowmaker/big-wm
# (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).           e big-windowmaker/packages e monta o repositório local
# (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).           [bigwm-local] (NÃO assinado: somente ISOs de teste).
#   build (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).   motor de ISO da BigLinux (biglinux/iso-profiles fixado por SHA)
# (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).           no mesmo contêiner privilegiado que a BigLinux usa (fixado por
# (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).           digest), com [bigwm-local] injetado logo antes do buildiso.
#   smoke-test  boot da ISO em QEMU (BIOS e UEFI/OVMF) até a sessão live e
# (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).           prova de que a sessão Window Maker é utilizável.
#   install-test instalação pelo Calamares (BIOS e UEFI) com o harness openQA
# (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).           da BigLinux fixado por SHA + overlay (openqa/), reinício pelo
# (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).           disco instalado, login no LightDM e sessão big-wm.
#   release (.github/docs/PLANEJAMENTO-ESTRATEGICO.md). só por workflow_dispatch com publish=true, no environment
# (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).           iso-release: SHA256SUMS + GitHub Release como pre-release.
#
# Detalhes, limites e configuração do repositório: README.md.
name: Build ISO

on:
  workflow_dispatch:
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).inputs:
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  branch:
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    # testing: community-testing/stable/extra e biglinux-testing/stable/extra,
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    # no build e no pacman.conf do sistema instalado (os mesmos repositórios,
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    # na mesma ordem, do big-comm/build-package). stable: sem os *-testing.
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    description: "Branch BigCommunity/BigLinux dos pacotes"
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    type: choice
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    default: testing
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    options: [testing, stable]
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  kernel:
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    description: "Kernel (seletor do motor da BigLinux)"
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    type: choice
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    default: lts
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    options: [lts, oldlts, latest, big]
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  profiles_ref:
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    description: "Ref (branch, tag ou SHA) de big-windowmaker/iso-profiles"
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    type: string
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    default: main
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  require_livecd_patch:
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    description: "Reprovar o smoke test se o biglinux-livecd não tiver o patch do Window Maker"
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    type: boolean
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    default: true
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  publish:
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    description: "Publicar como pre-release (environment iso-release)"
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    type: boolean
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    default: false
  schedule:
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).# Diária (05:17 UTC): ISO com os valores padrão (testing), sem publicar.
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).# Critério da Beta: smoke e openQA verdes 7 dias seguidos
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).# (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).- cron: "17 5 * * *"

permissions: {}

concurrency:
  group: build-iso-${{ github.ref }}-${{ inputs.branch || 'testing' }}
  cancel-in-progress: false

env:
  # Servidores dos repositórios BigLinux e BigCommunity (o motor lê as duas
  # variáveis; o sistema instalado também). Trocáveis sem mexer no workflow:
  # gh variable set BIGLINUX_REPO_HOST|COMMUNITY_REPO_HOST -R big-windowmaker/build-iso.
  # Desde 2026-10-28 a Cloudflare na frente do repo.communitybig.org responde
  # aos runners com o desafio de JavaScript (403, cf-mitigated: challenge)
  # quando o pedido vem do curl, mesmo com o user-agent do pacman; o pacman
  # de verdade passa (big-comm/build-package e o job resolve, 2026-11-02).
  # Por isso os repositórios são conferidos com o pacman; ver também o
  # workflow diagnose-repos.yml.
  BIGLINUX_REPO_HOST: ${{ vars.BIGLINUX_REPO_HOST || 'packages.biglinux.com.br' }}
  COMMUNITY_REPO_HOST: ${{ vars.COMMUNITY_REPO_HOST || 'repo.communitybig.org' }}
  # Branch do Manjaro: sempre stable, no motor e na simulação (job resolve).
  # O input branch só escolhe os repositórios BigCommunity/BigLinux.
  MANJARO_BRANCH: stable
  # Motor de ISO da BigLinux, fixado por commit. Para atualizar:
  #   gh api repos/biglinux/iso-profiles/commits/main --jq .sha
  # e revisar o diff de build-iso/ antes de trocar.
  ENGINE_REPO: biglinux/iso-profiles
  ENGINE_SHA: 8ec5ad1f861156055a35bcf3a82702178d319c8a # main em 2026-10-22
  PROFILES_REPO: big-windowmaker/iso-profiles
  DISTRONAME: bigcommunity
  EDITION: wmaker
  # Fontes do repositório local [bigwm-local]: UMA por linha,
  #   <dono/repo> <arquivo do workflow> <nome do artefato>
  # Só são aceitos artefatos de runs de push no branch main concluídos com
  # sucesso (ver scripts/fetch-package-artifacts.sh). big-windowmaker/packages
  # publica um artefato por diretório de pacote: packages-<diretório>.
  PACKAGE_SOURCES: |
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).big-windowmaker/big-wm    ci.yml     big-wm-packages
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).big-windowmaker/tabbed-dock ci.yml   tabbed-dock-packages
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).big-windowmaker/big-wm-display-resolution ci.yml display-resolution-packages
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).big-windowmaker/big-keyboard ci.yml  big-keyboard-packages
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).big-windowmaker/packages  build.yml  packages-big-wm-keyring
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).big-windowmaker/packages  build.yml  packages-windowmaker
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).big-windowmaker/packages  build.yml  packages-wlmaker
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).big-windowmaker/packages  build.yml  packages-big-dockapps
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).big-windowmaker/packages  build.yml  packages-biglinux-livecd
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).big-windowmaker/packages  build.yml  packages-gtk-nocsd
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).big-windowmaker/packages  build.yml  packages-qtstep-kvantum
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).big-windowmaker/packages  build.yml  packages-onestepback-gtk-theme
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).big-windowmaker/packages  build.yml  packages-retrothemes-firefox
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).big-windowmaker/packages  build.yml  packages-wdm
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).big-windowmaker/packages  build.yml  packages-wmake-zones
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).big-windowmaker/packages  build.yml  packages-wmpulsemixer
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).big-windowmaker/packages  build.yml  packages-thunar-git
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).# dependência do thunar-git (>= 4.21.8; o extra tem a 4.20), por isso
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).# fora de EXPECTED_PACKAGES, que o lint confere nas listas do perfil
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).big-windowmaker/packages  build.yml  packages-libxfce4ui
  # Pacotes que precisam sair do repositório local e estar na ISO.
  EXPECTED_PACKAGES: >-
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).big-wm-session big-wm-wayland big-wm-themes big-wm-welcome big-wm-zoom windowmaker wlmaker
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).wmcpuload wmbattery wmusic wmudmount wmshutdown wmmoonclock wmnet
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).wmclock wmmemload wmsystemtray biglinux-livecd gtk-nocsd
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).wmcube pclock wmwifi wmapmload minidock minicontrol mountapp
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).qtstep-kvantum onestepback-gtk-theme retrothemes-firefox
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).big-wm-tabbed-dock big-wm-display-resolution big-wm-lockscreen big-wm-name grub-theme-big-wm plymouth-theme-big-wm wdm wmake-zones wmpulsemixer wmeyes
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).wmcalc wmcalclock wmcliphist wmclockmon wmcpufreq wmfsm wmglobe wmgtemp wmmon wmpager wmsun wmtime wmtop wmtz wmweather
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).big-keyboard thunar-git big-wm-keyring
  # Imagem usada só para rodar repo-add sem rede (manjarolinux/base, a mesma
  # de big-windowmaker/packages). O Dependabot não atualiza digests usados
  # em `run:`; atualizar à mão.
  MANJARO_BASE_IMAGE: docker.io/manjarolinux/base@sha256:bbf1f1d746f28e138eea610e140d2f28cbb5b7c5da2fbff034b883527aa604e9

jobs:
  lint:
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).name: Lint (perfil e scripts)
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).runs-on: ubuntu-24.04
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).timeout-minutes: 15
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).permissions:
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  contents: read
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).outputs:
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  branch: ${{ steps.inputs.outputs.branch }}
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  kernel: ${{ steps.inputs.outputs.kernel }}
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  require_livecd_patch: ${{ steps.inputs.outputs.require_livecd_patch }}
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  profiles_sha: ${{ steps.profiles.outputs.sha }}
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).steps:
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  - name: Validar entradas
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    id: inputs
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    env:
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      IN_BRANCH: ${{ inputs.branch }}
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      IN_KERNEL: ${{ inputs.kernel }}
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      IN_PROFILES_REF: ${{ inputs.profiles_ref }}
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      IN_REQUIRE_PATCH: ${{ inputs.require_livecd_patch }}
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    run: |
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      set -euo pipefail
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      # No agendamento as entradas chegam vazias: valores padrão.
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      branch=${IN_BRANCH:-testing}
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      kernel=${IN_KERNEL:-lts}
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      ref=${IN_PROFILES_REF:-main}
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      require=${IN_REQUIRE_PATCH:-true}
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      [[ "$branch" =~ ^(testing|stable)$ ]] || { echo "branch inválido: $branch" >&2; exit 1; }
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      [[ "$kernel" =~ ^(lts|oldlts|latest|big)$ ]] || { echo "kernel inválido: $kernel" >&2; exit 1; }
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      [[ "$ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ && "$ref" != *..* ]] \
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).        || { echo "profiles_ref inválido: $ref" >&2; exit 1; }
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      [[ "$require" =~ ^(true|false)$ ]] || { echo "require_livecd_patch inválido" >&2; exit 1; }
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      [[ "$ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "ENGINE_SHA inválido" >&2; exit 1; }
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      {
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).        echo "branch=$branch"
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).        echo "kernel=$kernel"
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).        echo "profiles_ref=$ref"
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).        echo "require_livecd_patch=$require"
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      } >> "$GITHUB_OUTPUT"

 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  - name: Checkout deste repositório
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    with:
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      path: ci
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      persist-credentials: false

 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  - name: Checkout dos perfis
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    with:
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      repository: ${{ env.PROFILES_REPO }}
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      ref: ${{ steps.inputs.outputs.profiles_ref }}
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      path: profiles
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      persist-credentials: false

 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  - name: Fixar o commit dos perfis
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    id: profiles
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    run: |
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      set -euo pipefail
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      sha=$(git -C profiles rev-parse HEAD)
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      echo "sha=$sha" >> "$GITHUB_OUTPUT"
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      echo "Perfis: $PROFILES_REPO@$sha" >> "$GITHUB_STEP_SUMMARY"

 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  - name: Scripts deste repositório (bash -n e shellcheck)
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    run: |
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      set -euo pipefail
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      for script in ci/scripts/*.sh; do
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).        bash -n "$script"
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      done
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      shellcheck --version
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      shellcheck ci/scripts/*.sh
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      python3 -I ci/scripts/org-readme.py --self-test

 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  - name: Links simbólicos da edição
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    run: bash ci/scripts/check-symlinks.sh profiles "$DISTRONAME/$EDITION"

 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  - name: Pacotes esperados listados na edição
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    run: |
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      set -euo pipefail
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      # Root e Live costumam ser links para shared/; o grep segue os links.
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      edition="profiles/$DISTRONAME/$EDITION"
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      lists=("$edition/Packages-Root" "$edition/Packages-Desktop" "$edition/Packages-Live")
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      missing=0
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      for name in $EXPECTED_PACKAGES; do
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).        # Aceita marcadores do manjaro-tools (">extra nome") e restrições de versão.
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).        if ! grep -Eqh "^(>[a-z0-9_]+[[:space:]]+)?${name}([<>=]|[[:space:]]|$)" "${lists[@]}"; then
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).          echo "::error file=$edition/Packages-Desktop::$name não está em Packages-Root/Desktop/Live"
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).          missing=1
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).        fi
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      done
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      exit "$missing"

 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  - name: Testes pytest do iso-profiles
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    run: |
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      set -euo pipefail
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      # grub-script-check (grub-common) e msgfmt (gettext) são usados pelos testes.
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      if ! command -v grub-script-check >/dev/null || ! command -v msgfmt >/dev/null; then
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).        sudo apt-get update
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).        sudo apt-get install --yes --no-install-recommends grub-common gettext
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      fi
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      python3 -m venv "$RUNNER_TEMP/venv"
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check --quiet 'pytest==9.1.1'
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      cd profiles
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      "$RUNNER_TEMP/venv/bin/python" -m pytest -q -ra tests/

  local-repo:
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).name: Repositório local [bigwm-local]
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).runs-on: ubuntu-24.04
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).timeout-minutes: 20
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).permissions:
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  contents: read
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  actions: read
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).steps:
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  - name: Checkout deste repositório
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    with:
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      persist-credentials: false

 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  - name: Baixar os artefatos de pacotes (runs de push em main)
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    env:
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      # GITHUB_TOKEN vale só para este repositório; para ler artefatos de
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      # outros repositórios pode ser necessário um token com
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      # "Actions: read" neles (ver README, "Limites").
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      GH_TOKEN: ${{ secrets.ARTIFACTS_READ_TOKEN || github.token }}
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    run: bash scripts/fetch-package-artifacts.sh "$RUNNER_TEMP/artifacts"

 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).  - name: Montar o repositório com repo-add (contêiner sem rede)
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).    run: |
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      set -euo pipefail
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      mkdir -p "$RUNNER_TEMP/bigwm-local"
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      docker run --rm --network none \
 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).        --user "$(id -u):$(id -g)" \
