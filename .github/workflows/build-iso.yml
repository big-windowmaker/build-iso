# Gera a ISO de TESTE do Big WindowMaker (edição bigcommunity/wmaker).
#
#   lint        sem privilégios: valida as entradas, confere links simbólicos
#               da edição, roda os testes pytest do iso-profiles, bash -n e
#               shellcheck nos scripts deste repositório.
#   local-repo  baixa os pacotes dos artefatos de CI de big-windowmaker/big-wm
#               e big-windowmaker/packages e monta o repositório local
#               [bigwm-local] (NÃO assinado: somente ISOs de teste).
#   build       motor de ISO da BigLinux (biglinux/iso-profiles fixado por SHA)
#               no mesmo contêiner privilegiado que a BigLinux usa (fixado por
#               digest), com [bigwm-local] injetado logo antes do buildiso.
#   smoke-test  boot da ISO em QEMU (BIOS e UEFI/OVMF) até a sessão live.
#   release     só por workflow_dispatch com publish=true, no environment
#               iso-release: SHA256SUMS + GitHub Release como pre-release.
#
# Detalhes, limites e configuração do repositório: README.md.
name: Build ISO

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch BigCommunity/BigLinux dos pacotes"
        type: choice
        default: stable
        options: [stable, testing]
      kernel:
        description: "Kernel (seletor do motor da BigLinux)"
        type: choice
        default: lts
        options: [lts, oldlts, latest, big]
      profiles_ref:
        description: "Ref (branch, tag ou SHA) de big-windowmaker/iso-profiles"
        type: string
        default: wmaker-edition
      require_livecd_patch:
        description: "Reprovar o smoke test se o biglinux-livecd não tiver o patch do Window Maker"
        type: boolean
        default: true
      publish:
        description: "Publicar como pre-release (environment iso-release)"
        type: boolean
        default: false
  schedule:
    # Semanal (segunda-feira, 05:17 UTC): ISO com os valores padrão (stable).
    - cron: "17 5 * * 1"

permissions: {}

concurrency:
  group: build-iso-${{ github.ref }}-${{ inputs.branch || 'stable' }}
  cancel-in-progress: false

env:
  # Motor de ISO da BigLinux, fixado por commit. Para atualizar:
  #   gh api repos/biglinux/iso-profiles/commits/main --jq .sha
  # e revisar o diff de build-iso/ antes de trocar.
  ENGINE_REPO: biglinux/iso-profiles
  ENGINE_SHA: 8ec5ad1f861156055a35bcf3a82702178d319c8a # main em 2026-10-22
  PROFILES_REPO: big-windowmaker/iso-profiles
  DISTRONAME: bigcommunity
  EDITION: wmaker
  # Fontes do repositório local [bigwm-local]: UMA por linha,
  #   <dono/repo> <arquivo do workflow> <nome do artefato>
  # Só são aceitos artefatos de runs de push no branch main concluídos com
  # sucesso (ver scripts/fetch-package-artifacts.sh). big-windowmaker/packages
  # publica um artefato por diretório de pacote: packages-<diretório>.
  PACKAGE_SOURCES: |
    big-windowmaker/big-wm    ci.yml     big-wm-packages
    big-windowmaker/packages  build.yml  packages-windowmaker
    big-windowmaker/packages  build.yml  packages-wlmaker
    big-windowmaker/packages  build.yml  packages-big-dockapps
    big-windowmaker/packages  build.yml  packages-biglinux-livecd
  # Pacotes que precisam sair do repositório local e estar na ISO.
  EXPECTED_PACKAGES: >-
    big-wm-session big-wm-wayland big-wm-themes windowmaker wlmaker
    wmcpuload wmbattery wmusic wmudmount wmshutdown wmmoonclock wmnet
    wmclock wmmemload wmsystemtray biglinux-livecd
  # Imagem usada só para rodar repo-add sem rede (manjarolinux/base, a mesma
  # de big-windowmaker/packages). O Dependabot não atualiza digests usados
  # em `run:`; atualizar à mão.
  MANJARO_BASE_IMAGE: docker.io/manjarolinux/base@sha256:bbf1f1d746f28e138eea610e140d2f28cbb5b7c5da2fbff034b883527aa604e9

jobs:
  lint:
    name: Lint (perfil e scripts)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      branch: ${{ steps.inputs.outputs.branch }}
      kernel: ${{ steps.inputs.outputs.kernel }}
      require_livecd_patch: ${{ steps.inputs.outputs.require_livecd_patch }}
      profiles_sha: ${{ steps.profiles.outputs.sha }}
    steps:
      - name: Validar entradas
        id: inputs
        env:
          IN_BRANCH: ${{ inputs.branch }}
          IN_KERNEL: ${{ inputs.kernel }}
          IN_PROFILES_REF: ${{ inputs.profiles_ref }}
          IN_REQUIRE_PATCH: ${{ inputs.require_livecd_patch }}
        run: |
          set -euo pipefail
          # No agendamento as entradas chegam vazias: valores padrão.
          branch=${IN_BRANCH:-stable}
          kernel=${IN_KERNEL:-lts}
          ref=${IN_PROFILES_REF:-wmaker-edition}
          require=${IN_REQUIRE_PATCH:-true}
          [[ "$branch" =~ ^(testing|stable)$ ]] || { echo "branch inválido: $branch" >&2; exit 1; }
          [[ "$kernel" =~ ^(lts|oldlts|latest|big)$ ]] || { echo "kernel inválido: $kernel" >&2; exit 1; }
          [[ "$ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,99}$ && "$ref" != *..* ]] \
            || { echo "profiles_ref inválido: $ref" >&2; exit 1; }
          [[ "$require" =~ ^(true|false)$ ]] || { echo "require_livecd_patch inválido" >&2; exit 1; }
          [[ "$ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "ENGINE_SHA inválido" >&2; exit 1; }
          {
            echo "branch=$branch"
            echo "kernel=$kernel"
            echo "profiles_ref=$ref"
            echo "require_livecd_patch=$require"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout deste repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          persist-credentials: false

      - name: Checkout dos perfis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PROFILES_REPO }}
          ref: ${{ steps.inputs.outputs.profiles_ref }}
          path: profiles
          persist-credentials: false

      - name: Fixar o commit dos perfis
        id: profiles
        run: |
          set -euo pipefail
          sha=$(git -C profiles rev-parse HEAD)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Perfis: $PROFILES_REPO@$sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Scripts deste repositório (bash -n e shellcheck)
        run: |
          set -euo pipefail
          for script in ci/scripts/*.sh; do
            bash -n "$script"
          done
          shellcheck --version
          shellcheck ci/scripts/*.sh

      - name: Links simbólicos da edição
        run: bash ci/scripts/check-symlinks.sh profiles "$DISTRONAME/$EDITION"

      - name: Pacotes esperados listados na edição
        run: |
          set -euo pipefail
          # Root e Live costumam ser links para shared/; o grep segue os links.
          edition="profiles/$DISTRONAME/$EDITION"
          lists=("$edition/Packages-Root" "$edition/Packages-Desktop" "$edition/Packages-Live")
          missing=0
          for name in $EXPECTED_PACKAGES; do
            # Aceita marcadores do manjaro-tools (">extra nome") e restrições de versão.
            if ! grep -Eqh "^(>[a-z0-9_]+[[:space:]]+)?${name}([<>=]|[[:space:]]|$)" "${lists[@]}"; then
              echo "::error file=$edition/Packages-Desktop::$name não está em Packages-Root/Desktop/Live"
              missing=1
            fi
          done
          exit "$missing"

      - name: Testes pytest do iso-profiles
        run: |
          set -euo pipefail
          # grub-script-check (grub-common) e msgfmt (gettext) são usados pelos testes.
          if ! command -v grub-script-check >/dev/null || ! command -v msgfmt >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends grub-common gettext
          fi
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check --quiet 'pytest==9.1.1'
          cd profiles
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q -ra tests/

  local-repo:
    name: Repositório local [bigwm-local]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout deste repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Baixar os artefatos de pacotes (runs de push em main)
        env:
          # GITHUB_TOKEN vale só para este repositório; para ler artefatos de
          # outros repositórios pode ser necessário um token com
          # "Actions: read" neles (ver README, "Limites").
          GH_TOKEN: ${{ secrets.ARTIFACTS_READ_TOKEN || github.token }}
        run: bash scripts/fetch-package-artifacts.sh "$RUNNER_TEMP/artifacts"

      - name: Montar o repositório com repo-add (contêiner sem rede)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bigwm-local"
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -e EXPECTED_PACKAGES \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            -v "$RUNNER_TEMP/artifacts:/in:ro" \
            -v "$RUNNER_TEMP/bigwm-local:/out" \
            "$MANJARO_BASE_IMAGE" \
            bash /scripts/make-local-repo.sh /in /out
          cp "$RUNNER_TEMP/artifacts/sources.tsv" "$RUNNER_TEMP/bigwm-local/bigwm-local.sources.tsv"
          {
            echo "### Repositório local [bigwm-local] (NÃO assinado, somente teste)"
            echo
            echo '```'
            grep -v '^#' "$RUNNER_TEMP/bigwm-local/bigwm-local.manifest" | cut -d' ' -f1-3,6
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar o repositório como artefato
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bigwm-local-${{ github.run_id }}
          path: ${{ runner.temp }}/bigwm-local/
          if-no-files-found: error
          retention-days: 3

  resolve:
    name: Resolução de pacotes (simulação pacman)
    needs: [lint, local-repo]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout deste repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          persist-credentials: false

      - name: Checkout dos perfis (mesmo commit do lint)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PROFILES_REPO }}
          ref: ${{ needs.lint.outputs.profiles_sha }}
          path: profiles
          persist-credentials: false

      - name: Baixar o [bigwm-local]
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bigwm-local-${{ github.run_id }}
          path: ${{ runner.temp }}/bigwm-local

      - name: Simular a instalação das listas da edição
        env:
          BRANCH: ${{ needs.lint.outputs.branch }}
        run: |
          set -euo pipefail
          edition="$GITHUB_WORKSPACE/profiles/$DISTRONAME/$EDITION"
          # cp -L: Packages-Root/Live são links para shared/ no checkout.
          mkdir -p "$RUNNER_TEMP/edition"
          cp -L "$edition"/Packages-{Root,Desktop,Live} "$RUNNER_TEMP/edition/"
          docker run --rm \
            -v "$GITHUB_WORKSPACE/ci/scripts:/scripts:ro" \
            -v "$RUNNER_TEMP/edition:/edition:ro" \
            -v "$RUNNER_TEMP/bigwm-local:/srv/bigwm-local:ro" \
            "$MANJARO_BASE_IMAGE" \
            bash /scripts/resolve-edition.sh /edition /srv/bigwm-local "$BRANCH" \
            | tee "$RUNNER_TEMP/resolve.txt"
          { echo "### Resolução de pacotes ($BRANCH)"; echo '```'; cat "$RUNNER_TEMP/resolve.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ISO ${{ needs.lint.outputs.branch }} ${{ needs.lint.outputs.kernel }}
    needs: [lint, local-repo, resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    outputs:
      iso: ${{ steps.output.outputs.iso }}
    container:
      # A mesma imagem e o mesmo digest do workflow Build ISO de
      # biglinux/iso-profiles (no ENGINE_SHA). Atualizar junto com o motor.
      image: xivastudio/biglinux_build_package@sha256:317d3f13ea00967f325fc12dd9926a6a8035802def37c99e5dedcebbf647c9c2
      # Privilegiado: buildiso usa loop devices, mount e chroot.
      options: --privileged
      volumes:
        # Disco grande do runner em /mnt: os chroots e o cache da ISO não
        # cabem no disco raiz.
        - /mnt/var_lib_manjaro_tools_buildiso:/var/lib/manjaro-tools/buildiso
        - /mnt/var_cache_manjaro_tools_iso:/var/cache/manjaro-tools/iso
    steps:
      - name: Checkout deste repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          persist-credentials: false

      - name: Checkout do motor (biglinux/iso-profiles fixado)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ env.ENGINE_SHA }}
          path: engine
          persist-credentials: false

      - name: Checkout dos perfis (commit validado no lint)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PROFILES_REPO }}
          ref: ${{ needs.lint.outputs.profiles_sha }}
          path: profiles
          persist-credentials: false

      - name: Conferir os commits
        env:
          PROFILES_SHA: ${{ needs.lint.outputs.profiles_sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE/engine"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/profiles"
          [[ "$(git -C engine rev-parse HEAD)" == "$ENGINE_SHA" ]]
          [[ "$(git -C profiles rev-parse HEAD)" == "$PROFILES_SHA" ]]

      - name: Baixar o repositório local
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bigwm-local-${{ github.run_id }}
          path: /srv/bigwm-local

      - name: Construir a ISO (motor da BigLinux + [bigwm-local])
        env:
          KERNEL: ${{ needs.lint.outputs.kernel }}
          BIG_BRANCH: ${{ needs.lint.outputs.branch }}
        run: |
          set -euo pipefail
          [[ "$KERNEL" =~ ^(lts|oldlts|latest|big)$ && "$BIG_BRANCH" =~ ^(testing|stable)$ ]]
          export ENGINE_DIR="$GITHUB_WORKSPACE/engine"
          export PROFILES_ROOT="$GITHUB_WORKSPACE/profiles"
          export WORK_PATH="$GITHUB_WORKSPACE/output"
          export BIGWM_LOCAL_REPO=/srv/bigwm-local
          export MANJARO_BRANCH=stable
          export BIGCOMMUNITY_BRANCH="$BIG_BRANCH"
          export BIGLINUX_BRANCH="$BIG_BRANCH"
          export KERNEL EDITION DISTRONAME
          bash ci/scripts/run-engine.sh

      - name: Checksums, lista de pacotes e conferência do repositório local
        id: output
        env:
          PROFILES_SHA: ${{ needs.lint.outputs.profiles_sha }}
        run: |
          set -euo pipefail
          cd output
          mapfile -t isos < <(find . -maxdepth 1 -type f -name '*.iso' -printf '%f\n')
          ((${#isos[@]} == 1)) || { echo "esperada 1 ISO, encontradas ${#isos[@]}" >&2; exit 1; }
          iso=${isos[0]}
          [[ "$iso" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.iso$ ]]
          [[ -s "$iso.pkgs" ]] || { echo "lista de pacotes $iso.pkgs ausente" >&2; exit 1; }
          bash ../ci/scripts/check-iso-packages.sh "$iso.pkgs" /srv/bigwm-local/bigwm-local.manifest
          cp /srv/bigwm-local/bigwm-local.manifest "$iso.bigwm-local.manifest"
          cp /srv/bigwm-local/bigwm-local.sources.tsv "$iso.bigwm-local.sources.tsv"
          {
            echo "iso=$iso"
            echo "engine=$ENGINE_REPO@$ENGINE_SHA"
            echo "profiles=$PROFILES_REPO@$PROFILES_SHA"
            echo "workflow_run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "build_iso_commit=$GITHUB_SHA"
          } > "$iso.build-info"
          sha256sum "$iso" > "$iso.sha256"
          cat "$iso.sha256" "$iso.build-info"
          echo "iso=$iso" >> "$GITHUB_OUTPUT"

      - name: Publicar a ISO como artefato (candidata, não publicada)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iso-${{ github.run_id }}
          path: output/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  smoke-test:
    name: Smoke test (${{ matrix.firmware }})
    needs: [lint, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        firmware: [bios, uefi]
    steps:
      - name: Checkout deste repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar QEMU, OVMF e KVM
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 ovmf
          # Acesso ao /dev/kvm para o usuário do runner (receita da documentação do GitHub).
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm -a -w /dev/kvm
          sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/smoke
          for pair in /usr/share/OVMF/OVMF_CODE_4M.fd:/usr/share/OVMF/OVMF_VARS_4M.fd \
                      /usr/share/OVMF/OVMF_CODE.fd:/usr/share/OVMF/OVMF_VARS.fd; do
            if [[ -f "${pair%%:*}" && -f "${pair##*:}" ]]; then
              echo "OVMF_CODE=${pair%%:*}" >> "$GITHUB_ENV"
              echo "OVMF_VARS=${pair##*:}" >> "$GITHUB_ENV"
              break
            fi
          done

      - name: Baixar a ISO candidata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso-${{ github.run_id }}
          path: /mnt/smoke/iso

      - name: Boot em QEMU até a sessão live
        env:
          ISO: ${{ needs.build.outputs.iso }}
          FIRMWARE: ${{ matrix.firmware }}
          REQUIRE_PATCH: ${{ needs.lint.outputs.require_livecd_patch }}
        run: |
          set -euo pipefail
          [[ "$ISO" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.iso$ ]]
          (cd /mnt/smoke/iso && sha256sum --check --strict -- "$ISO.sha256")
          args=(--iso "/mnt/smoke/iso/$ISO" --firmware "$FIRMWARE"
                --out "/mnt/smoke/out-$FIRMWARE" --require-livecd-patch "$REQUIRE_PATCH")
          if [[ "$FIRMWARE" == uefi ]]; then
            args+=(--ovmf-code "$OVMF_CODE" --ovmf-vars "$OVMF_VARS")
          fi
          bash scripts/smoke-test.sh "${args[@]}"

      - name: Guardar logs e capturas de tela
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.firmware }}-${{ github.run_id }}
          path: /mnt/smoke/out-${{ matrix.firmware }}/
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publicar pre-release
    needs: [lint, build, smoke-test]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: iso-release
    permissions:
      contents: write
    steps:
      - name: Preparar o diretório
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/release

      - name: Baixar a ISO aprovada no smoke test
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iso-${{ github.run_id }}
          path: /mnt/release

      - name: Conferir, gerar SHA256SUMS e dividir se passar de 2 GiB
        env:
          ISO: ${{ needs.build.outputs.iso }}
        run: |
          set -euo pipefail
          [[ "$ISO" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.iso$ ]]
          cd /mnt/release
          sha256sum --check --strict -- "$ISO.sha256"
          # SHA256SUMS cobre a ISO inteira (o que o usuário confere depois de
          # juntar as partes) e os arquivos auxiliares.
          sha256sum -- "$ISO" "$ISO.pkgs" "$ISO.bigwm-local.manifest" \
            "$ISO.bigwm-local.sources.tsv" "$ISO.build-info" > SHA256SUMS
          # Limite de 2 GiB por asset de release: divide em partes 7z.
          if [[ -n "$(du --threshold=2000M -- "$ISO")" ]]; then
            command -v 7z >/dev/null || { sudo apt-get update; sudo apt-get install --yes p7zip-full; }
            7z a -mx=0 -v2000m -- "$ISO.7z" "$ISO"
            rm -- "$ISO"
            sha256sum -- "$ISO".7z.* >> SHA256SUMS
          fi
          cat SHA256SUMS

      - name: Criar a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          ISO: ${{ needs.build.outputs.iso }}
        run: |
          set -euo pipefail
          cd /mnt/release
          tag="${ISO%.iso}-r${GITHUB_RUN_NUMBER}"
          [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          {
            echo "**ISO de TESTE do Big WindowMaker. Não use em produção.**"
            echo
            echo "- Pacotes do Big WindowMaker vêm de um repositório local **não assinado** ([bigwm-local]), montado a partir de artefatos de CI. A assinatura (chave própria, bigwm-keyring, SHA256SUMS.sig) é a fase 2."
            echo "- A sessão live precisa do patch do biglinux-livecd (branch \`window-maker\` de big-windowmaker/biglinux-livecd) até ele entrar na BigLinux; sem ele a sessão entra em loop no login."
            echo "- Aprovada no smoke test em QEMU (BIOS e UEFI). Não passou pelo gate openQA da BigLinux (instalação não é testada)."
            echo
            echo "Confira com \`sha256sum -c SHA256SUMS\` (se a ISO estiver em partes: \`7z x $ISO.7z.001\` antes)."
            echo
            echo '```'
            cat "$ISO.build-info"
            echo '```'
          } > notes.md
          mapfile -t files < <(find . -maxdepth 1 -type f ! -name notes.md -printf '%f\n' | sort)
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$ISO (teste)" \
            --notes-file notes.md \
            -- "${files[@]}"
