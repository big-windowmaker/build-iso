 (.github/docs/PLANEJAMENTO-ESTRATEGICO.md).      [[ "$OPENQA_IMAGE" =~ ^ghcr\.io/big-windowmaker/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
