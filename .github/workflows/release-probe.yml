# Diagnóstico temporário: o job "release" recebe HTTP 403 ao criar a
# release publicada; rascunhos funcionam. Testa a hipótese de que publicar
# exige criar a tag num commit que altera workflows. Remover depois.
name: Diagnóstico de release
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    environment: iso-release
    permissions:
      contents: write
    steps:
      - name: Publicar sem tag prévia (esperado 403 se a hipótese vale)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          echo nota > notes.md; echo teste > a.txt
          tag="probe-$GITHUB_RUN_ID-pub"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "probe" --notes-file notes.md -- a.txt && echo "RESULT_PUB=ok" || echo "RESULT_PUB=falhou"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
      - name: Criar a tag pela API de refs e publicar com --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          echo nota > notes.md; echo teste > a.txt
          tag="probe-$GITHUB_RUN_ID-tag"
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null \
            && echo "RESULT_REF=ok" || echo "RESULT_REF=falhou"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "probe" --notes-file notes.md -- a.txt && echo "RESULT_VERIFY=ok" || echo "RESULT_VERIFY=falhou"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
  probe-exact:
    runs-on: ubuntu-24.04
    environment: iso-release
    permissions:
      contents: write
    steps:
      - name: Mesmo comando do job release, arquivos pequenos
        env:
          GH_TOKEN: ${{ github.token }}
          ISO: bigcommunity_wmaker_2026-10-26_k618.iso
        run: |
          set -x
          mkdir rel && cd rel
          for f in "$ISO.7z.001" "$ISO.7z.002" "$ISO.7z.003" "$ISO.sha256" "$ISO.pkgs" "$ISO.bigwm-local.manifest" "$ISO.bigwm-local.sources.tsv" "$ISO.build-info" SHA256SUMS; do echo x > "$f"; done
          printf 'iso=%s\nworkflow_run=https://github.com/big-windowmaker/build-iso/actions/runs/1\n' "$ISO" > "$ISO.build-info"
          tag="probe-exact-${ISO%.iso}-r7"
          { echo "**Big WindowMaker — Alpha (ISO de teste). Não use em produção.**"; echo; echo '```'; cat "$ISO.build-info"; echo '```'; } > notes.md
          mapfile -t files < <(find . -maxdepth 1 -type f ! -name notes.md -printf '%f\n' | sort)
          GH_DEBUG=api gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target b2acad8 --prerelease \
            --title "Big WindowMaker Alpha — $ISO" --notes-file notes.md -- "${files[@]}" 2>debug.txt \
            && echo "RESULT_EXACT=ok" || { echo "RESULT_EXACT=falhou"; grep -E '^(\* Request to|< HTTP|\{"message)' debug.txt | head -20; }
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

