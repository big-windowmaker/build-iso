# Diagnóstico temporário do HTTP 403 ao publicar a release. Remover depois.
name: Diagnóstico de release
on:
  workflow_dispatch:
permissions: {}
jobs:
  bisect:
    runs-on: ubuntu-24.04
    environment: iso-release
    permissions:
      contents: write
    steps:
      - name: Variar um parâmetro por vez
        env:
          GH_TOKEN: ${{ github.token }}
          ISO: bigcommunity_wmaker_2026-10-26_k618.iso
        run: |
          echo x > a.txt
          printf 'iso=%s\nworkflow_run=https://github.com/big-windowmaker/build-iso/actions/runs/1\n' "$ISO" > info
          { echo "**Big WindowMaker — Alpha (ISO de teste). Não use em produção.**"; echo; echo '```'; cat info; echo '```'; } > notes-full.md
          echo nota > notes-simple.md
          try() { # rótulo tag target título notas
            if GH_DEBUG=api gh release create "$2" --repo "$GITHUB_REPOSITORY" --target "$3" --prerelease \
                 --title "$4" --notes-file "$5" -- a.txt >/dev/null 2>dbg.txt; then
              echo "RESULT $1 = ok"
            else
              echo "RESULT $1 = FALHOU: $(grep -o '"message":"[^"]*"' dbg.txt | head -2 | tr '\n' ' ')"
            fi
            gh release delete "$2" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          }
          r=$GITHUB_RUN_ID
          try "1-exato"            "p$r-1-${ISO%.iso}-r7" b2acad8      "Big WindowMaker Alpha — $ISO" notes-full.md
          try "2-target-HEAD"      "p$r-2-${ISO%.iso}-r7" "$GITHUB_SHA" "Big WindowMaker Alpha — $ISO" notes-full.md
          try "3-target-sha-longo" "p$r-3-${ISO%.iso}-r7" "$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" | awk '/b2acad8/{print $1; exit}')" "Big WindowMaker Alpha — $ISO" notes-full.md
          try "4-notas-simples"    "p$r-4-${ISO%.iso}-r7" b2acad8      "Big WindowMaker Alpha — $ISO" notes-simple.md
          try "5-titulo-simples"   "p$r-5-${ISO%.iso}-r7" b2acad8      "probe"                          notes-full.md
          try "6-tag-simples"      "p$r-6"                b2acad8      "Big WindowMaker Alpha — $ISO" notes-full.md
