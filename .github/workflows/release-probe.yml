# Diagnóstico temporário: o job "release" recebeu HTTP 403 ao criar a
# release. Cria e apaga um rascunho (não público) com o GITHUB_TOKEN para
# isolar a causa. Remover depois do diagnóstico.
name: Diagnóstico de release
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Rascunho via API, sem target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="probe-$GITHUB_RUN_ID-a" -F draft=true --jq .id > id-a || true
          [ -s id-a ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$(cat id-a)"
      - name: Rascunho via API, com target_commitish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="probe-$GITHUB_RUN_ID-b" -f target_commitish="$GITHUB_SHA" -F draft=true --jq .id > id-b || true
          [ -s id-b ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$(cat id-b)"
      - name: Criar tag via API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/probe-$GITHUB_RUN_ID-c" -f sha="$GITHUB_SHA" || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/probe-$GITHUB_RUN_ID-c" || true
